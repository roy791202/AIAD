function testPanel(type){const prev=lastTest[type];return `<div class="testpanel"><h3>${type==='cli'?'Agent 工具檢查':'MCP 連線與工具探測'}</h3><p class="muted" style="font-size:12px;margin:0 0 12px">測試 UI 回饋流程；此頁不啟動程序或建立網路連線。</p><div class="row"><label class="sr" for="test-${type}">模擬測試結果</label><select id="test-${type}" aria-label="${type==='cli'?'CLI':'MCP'} 模擬測試結果"><option value="success">模擬：成功</option><option value="missing">模擬：${type==='cli'?'找不到執行檔':'無法連線'}</option><option value="auth">模擬：驗證失敗</option><option value="timeout">模擬：逾時</option></select><button data-test="${type}">執行模擬測試</button>${type==='mcp'?'<button data-test="tools">模擬探測工具</button>':''}</div><div class="testresult" id="result-${type}" role="status">${prev||'<span class="muted">尚未測試</span>'}</div></div>`}
function advancedExtras(){return `<div class="group"><div class="grouphead"><h2>設定交換與維護</h2></div><div class="settingrow"><div><div class="setting-label">匯出與匯入</div><p>JSON 包含已儲存的個人／專案覆寫；排除工作階段與密鑰內容。</p></div><div class="row"><button data-action="export">匯出 JSON</button><button data-action="import">匯入 JSON</button></div></div><div class="settingrow"><div><div class="setting-label">還原目前範圍</div><p>清除此範圍的全部覆寫，先檢視再儲存；不清除其他範圍。</p></div><div><button data-action="resetScope" class="danger">清除此範圍覆寫</button></div></div><div class="settingrow"><div><div class="setting-label">原型驗證</div><p>檢查設定定義、預設值、作用範圍與驗證規則。不測試真實 Host。</p></div><div><button data-action="checks">執行結構檢查</button></div></div></div>`}
function render(){preview();paintNav();const cat=CATEGORIES.find(c=>c.id===category);$('#breadcrumb').textContent=search?'搜尋結果':cat.label;$('#title').textContent=search?'搜尋設定':cat.label;$('#description').textContent=search?'搜尋所有分類中，適用目前範圍的設定。':cat.description;$$('[data-scope]').forEach(el=>{el.classList.toggle('active',el.dataset.scope===scope);el.setAttribute('aria-pressed',el.dataset.scope===scope)});$('#scopeHint').textContent={personal:'保存在此瀏覽器；正式版為本機使用者偏好',project:'此示意專案的覆寫；可移除以繼承個人偏好',session:'本次頁面有效；重新開啟即清除'}[scope];let matching=FIELDS.filter(f=>supports(f)&&(search?`${f.label} ${f.help} ${f.group} ${f.key} ${CATEGORIES.find(c=>c.id===f.cat).label}`.toLowerCase().includes(search.toLowerCase()):f.cat===category));let html=`<div class="notice">${icon('shield')}<div><strong>離線互動原型</strong> · 儲存只影響此 HTML 在目前瀏覽器的設定。CLI、MCP、Git 與專案檔案皆未串接。${storageWarning?'<br>'+esc(storageWarning):''}</div></div>`;if(search)html+=`<div class="allsearch">「${esc(search)}」找到 ${matching.length} 個設定 · ${scopeNames[scope]}</div>`;if(!matching.length)html+=`<div class="empty"><h2>${search?'沒有符合的設定':'此分類不使用這個範圍'}</h2><p>${search?'請調整關鍵字或設定範圍。':'可切換「個人偏好」或「目前專案」，查看適用項目。'}</p></div>`;else{const groups=[...new Set(matching.map(f=>f.cat+'|'+f.group))];html+=groups.map(g=>{const[catId,title]=g.split('|');return `<section class="group"><div class="grouphead"><h2>${search?CATEGORIES.find(c=>c.id===catId).label+' / ':''}${esc(title)}</h2></div>${matching.filter(f=>f.cat===catId&&f.group===title).map(fieldRow).join('')}</section>`}).join('')}if(!search&&category==='agent')html+=testPanel('cli');if(!search&&category==='mcp')html+=testPanel('mcp');if(!search&&category==='advanced')html+=advancedExtras();$('#content').innerHTML=html;const current=matching.find(f=>f.key===selectedKey)||matching[0];if(current)selectedKey=current.key;updateFooter();paintInspector()}
function updateFooter(){const changed=diff(),other=SCOPES.filter(s=>s!==scope).reduce((n,s)=>n+diff(s).length,0),e=errors();$('#saveStatus').textContent=e.length?`${e.length} 個設定需要修正`:changed.length?`${changed.length} 項未儲存 · ${scopeNames[scope]}`:`${scopeNames[scope]} · 所有變更已儲存`;$('#saveStatus').className='status '+(e.length?'bad':'muted');$('#pageDirty').hidden=!changed.length;$('#pageDirty').textContent=changed.length+' 項未儲存'+(other?' · 其他範圍 '+other+' 項':'');$('#save').disabled=!changed.length||!!e.length;$('#resetPage').disabled=!!search||!FIELDS.some(f=>f.cat===category&&supports(f));$('#review').disabled=!changed.length;$('#revert').disabled=!changed.length;$('#save').textContent=scope==='session'?'套用至本次工作階段':'儲存設定'}
function editorPreview(){const depth=get('editor.expandDepth','session'),grid=get('editor.grid','session'),style=get('editor.connection','session'),d={curve:'M104 48 C150 48 124 111 188 111',elbow:'M104 48 H146 V111 H188',straight:'M104 48 L188 111'}[style];return `<div class="preview ${grid?'grid':''}"><svg viewBox="0 0 240 145" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg><div class="pnode a"><strong>Application</strong>${depth?'<div class="pslot">Slot · modules<br><small>▣ Agent</small></div>':'<div class="pslot">▸ Slot 已收合</div>'}</div><div class="pnode b">▣ Runtime<br><small>execution</small></div></div>`}

function inspectorHTML(f){const source=origin(f.key),v=get(f.key),err=validate(f,v),diagnostics=get('advanced.showDiagnostics','session');return `<div class="inspectbox"><h2 class="inspect-title">${esc(f.label)}</h2><p>${esc(f.help)}</p><div class="kv"><span>目前範圍</span><span>${scopeNames[scope]}</span></div><div class="kv"><span>值的來源</span><span>${source==='default'?'產品預設':scopeNames[source]}</span></div><div class="kv"><span>目前值</span><span>${esc(display(f,v))}</span></div><div class="kv"><span>保存方式</span><span>${scope==='session'?'僅本次頁面記憶體':'瀏覽器本機儲存（原型）'}</span></div>${err?`<p class="bad">${esc(err)}</p>`:''}</div>${['editor','general'].includes(f.cat)?`<div class="inspectbox"><h3>畫布預覽</h3>${editorPreview()}<p>設定改變顯示偏好；不修改節點與 Slot 的專案結構。</p></div>`:f.cat==='git'?`<div class="inspectbox"><h3>版本紀錄預覽</h3>${gitPreview()}<p>衝突狀態與是否可繼續，由 Git 實際結果決定。</p></div>`:''}<div class="inspectbox"><h3>設定繼承</h3><p>個人偏好 → 目前專案 → 本次工作階段。較後範圍只覆寫適用的項目；移除覆寫後，會回到上一層的有效值。</p><p>未儲存變更切換分類或範圍後仍會保留。</p></div>${diagnostics?`<div class="inspectbox"><h3>串接提案</h3><pre>${esc(f.key)}\nSettingsService.prepare / save\nSettingsChanged(scope, keys)</pre><p>本機路徑與憑證參照，與可分享的專案設定分開保存。正式版透過 Host 檢查後才套用。</p></div>`:''}`}
function paintInspector(){const f=byKey[selectedKey];$('#inspector').innerHTML=f?inspectorHTML(f):'<p class="muted">選擇設定以查看說明。</p>'}
function updateField(key,v){draft[scope][key]=clone(v);lastTest={};$$('[id="result-cli"],[id="result-mcp"]').forEach(el=>el.innerHTML='<span class="muted">設定已變更，尚未重新測試</span>');preview();updateFooter();paintNav();selectedKey=key;paintInspector();for(const f of FIELDS.filter(f=>supports(f))){const error=validate(f,get(f.key)),el=document.getElementById('error-'+f.key),input=document.getElementById('f-'+f.key);if(el){el.hidden=!error;el.textContent=error}if(input)input.setAttribute('aria-invalid',!!error)}const meta=$(`[data-meta="${key}"]`);if(meta)meta.innerHTML=inheritedMeta(byKey[key])}
function reviews(s=scope){return diff(s).map(f=>`<div class="reviewitem"><strong>${esc(f.label)}</strong><p>原本：${esc(display(f,get(f.key,s,saved)))}<br>變更：${esc(display(f,get(f.key,s,draft)))}</p></div>`).join('')}
function showReview(){dialogAction=()=>save();show('檢視變更 · '+scopeNames[scope],`<p>只儲存目前範圍；其他範圍的未儲存變更會保留。</p><div class="reviewlist">${reviews()}</div>`,`<button data-close>返回編輯</button><button class="primary" data-confirm>確認儲存</button>`)}
function save(){const e=errors();if(e.length){toast('請先修正：'+e[0].message);return false}const next=clone(saved);next[scope]=clone(draft[scope]);try{if(scope!=='session')localStorage.setItem(KEY,JSON.stringify({format:'EluSlot.Settings',version:1,profiles:{personal:next.personal,project:next.project}}));saved=next;close();render();toast(scopeNames[scope]+(scope==='session'?'已套用；重新開啟即清除。':'已儲存至此瀏覽器。'));return true}catch(e){show('設定尚未儲存','<p>瀏覽器本機儲存不可用。變更仍保留在此頁；可檢查瀏覽器設定，或使用 JSON 匯出已儲存資料。</p><p class="bad">'+esc(e.message)+'</p>');return false}}
function confirmReset(all=false){const keys=FIELDS.filter(f=>supports(f)&&(all||f.cat===category)).map(f=>f.key),label=all?'此範圍所有分類':CATEGORIES.find(c=>c.id===category).label;dialogAction=()=>{keys.forEach(k=>delete draft[scope][k]);close();lastTest={};render();toast('已移除 '+label+' 的覆寫；請儲存後套用。')};show('還原設定 · '+scopeNames[scope],`<p>將移除「${esc(label)}」在${scopeNames[scope]}中的覆寫，回到繼承值或預設值。</p><p>其他範圍不會改變。這項變更仍需儲存。</p>`,`<button data-close>取消</button><button data-confirm class="danger">移除覆寫</button>`)}
function test(type){const kind=type==='tools'?'mcp':type,e=errors().find(e=>type==='cli'?e.key.startsWith('agent.'):e.key==='mcp.servers');if(e){toast('請先修正：'+e.message);return}let result;if(kind==='cli'){const provider=get('agent.provider'),path=get('agent.'+provider+'Path','session');result='工具：'+esc(provider)+' · 命令：<code>'+esc(path)+'</code>'}else{const s=get('mcp.servers').find(s=>s.id===selectedServer);if(!s||!s.enabled){toast('請先新增並啟用一組連線。');return}result='伺服器：'+esc(s.name)+' · '+esc(s.transport)}const sim=$('#test-'+kind).value;const messages={success:type==='tools'?'模擬探測完成：list_tools、read_project、inspect_node（示意能力）':'模擬檢查成功；未執行任何程序或連線。',missing:kind==='cli'?'模擬：找不到執行檔。請檢查路徑或 PATH。':'模擬：無法連線。請檢查啟動命令或 URL。',auth:'模擬：驗證失敗。請檢查系統憑證參照。',timeout:'模擬：等待逾時。正式版須核對程序與伺服器的實際狀態。'};lastTest[kind]=`<strong class="${sim==='success'?'good':'bad'}">${messages[sim]}</strong><br>${result}`;$('#result-'+kind).innerHTML=lastTest[kind];toast('已顯示模擬測試結果')}
function serverChange(key,v){const list=get('mcp.servers'),s=list.find(x=>x.id===selectedServer);if(!s)return;s[key]=v;updateField('mcp.servers',list)}
function addServer(){const list=get('mcp.servers');if(list.length>=20)return;const id='server-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,5);let n=2;while(list.some(s=>s.name==='New Server '+n))n++;list.push({id,name:'New Server '+n,transport:'stdio',command:'mcp-server',args:'',url:'',credentialRef:'',enabled:true});selectedServer=id;updateField('mcp.servers',list);render()}
function exportData(){return {format:'EluSlot.Settings',version:1,profiles:{personal:clone(saved.personal),project:clone(saved.project)}}}
function download(){const blob=new Blob([JSON.stringify(exportData(),null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='EluSlot_Settings.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已匯出已儲存設定；不包含工作階段或密鑰。')}
function importText(text){let incoming;try{incoming=sanitizeConfig(JSON.parse(text))}catch(e){show('無法匯入設定','<p class="bad">'+esc(e.message)+'</p><p>目前設定與未儲存變更保持不變。</p>');return false}dialogAction=()=>{for(const s of ['personal','project'])draft[s]=clone(incoming[s]);lastTest={};close();render();toast('已載入為草稿。請切換各範圍檢查並分別儲存。')};show('匯入設定預覽',`<p>將以檔案內容取代個人與專案的草稿覆寫；本次工作階段保留。資料先載入草稿，尚未儲存。</p><p>個人：${Object.keys(incoming.personal).length} 項 · 專案：${Object.keys(incoming.project).length} 項</p>`,`<button data-close>取消</button><button data-confirm class="primary">載入為草稿</button>`);return true}
function runChecks(){const result=[],test=(name,ok)=>result.push({name,ok});test('設定鍵唯一',new Set(FIELDS.map(f=>f.key)).size===FIELDS.length);test('10 個分類都有設定',CATEGORIES.length===10&&CATEGORIES.every(c=>FIELDS.some(f=>f.cat===c.id)));test('所有預設值可通過驗證',SCOPES.every(s=>!errors(s,{personal:{},project:{},session:{}}).length));test('所有作用範圍合法',FIELDS.every(f=>f.scopes.length&&f.scopes.every(s=>SCOPES.includes(s))));test('所有條件依賴有效',FIELDS.every(f=>(!f.depends||byKey[f.depends])&&(!f.dependsValue||byKey[f.dependsValue[0]])));test('沒有密鑰輸入欄位',!FIELDS.some(f=>/token|password|secret/i.test(f.key)));test('匯出排除工作階段',!Object.hasOwn(exportData().profiles,'session'));show('原型結構檢查',result.map(r=>`<div class="testcheck ${r.ok?'good':'bad'}">${r.ok?'✓':'✕'} ${esc(r.name)}</div>`).join('')+'<p class="muted">這是文件與設定模型檢查，不代表已測試真實 CLI、MCP、Git 或桌面 Host。</p>');return result}
function action(id){if(id==='addServer')addServer();if(id==='deleteServer'){const s=get('mcp.servers').find(s=>s.id===selectedServer);if(!s)return;dialogAction=()=>{updateField('mcp.servers',get('mcp.servers').filter(s=>s.id!==selectedServer));close();render()};show('移除伺服器','<p>從目前範圍的連線清單移除「'+esc(s.name)+'」；不刪除系統憑證或伺服器。</p>','<button data-close>取消</button><button data-confirm class="danger">移除連線草稿</button>')}if(id==='credentials')show('系統憑證參照','<p>正式版交由桌面系統的 CredentialService 管理憑證。設定檔只保存參照名稱，秘密不傳入 UI、不寫入專案，也不出現在匯出 JSON。</p><p>此原型不提供密鑰輸入或憑證寫入。</p>');if(id==='resetScope')confirmReset(true);if(id==='export')download();if(id==='import')$('#importFile').click();if(id==='checks')runChecks()}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||el.disabled)return;if(el.dataset.category){category=el.dataset.category;search='';$('#search').value='';render();return}if(el.dataset.scope){scope=el.dataset.scope;lastTest={};render();return}if(el.dataset.key&&byKey[el.dataset.key].type==='toggle'){const key=el.dataset.key;updateField(key,!get(key));render();document.getElementById('f-'+key)?.focus();return}if(el.dataset.inherit){delete draft[scope][el.dataset.inherit];render();return}if(el.dataset.info){selectedKey=el.dataset.info;paintInspector();show(byKey[selectedKey].label,inspectorHTML(byKey[selectedKey]));return}if(el.dataset.test){test(el.dataset.test);return}if(el.dataset.action){action(el.dataset.action);return}if(el.hasAttribute('data-close')){close();return}if(el.hasAttribute('data-confirm')){const fn=dialogAction;if(fn)fn()}});

document.addEventListener('input',e=>{const el=e.target;if(el.dataset.key&&el.tagName!=='SELECT'&&byKey[el.dataset.key].type!=='toggle')updateField(el.dataset.key,byKey[el.dataset.key].type==='number'?(el.value===''?null:Number(el.value)):el.value);if(el.dataset.server&&!['SELECT','checkbox'].includes(el.tagName)&&el.type!=='checkbox')serverChange(el.dataset.server,el.value)});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.key&&el.tagName==='SELECT'){updateField(el.dataset.key,el.value);render()}if(el.dataset.server&&(el.tagName==='SELECT'||el.type==='checkbox')){serverChange(el.dataset.server,el.type==='checkbox'?el.checked:el.value);render()}if(el.id==='serverSelect'){selectedServer=el.value;lastTest={};render()}});
$('#search').oninput=e=>{search=e.target.value.trim();render()};$('#save').onclick=save;$('#review').onclick=showReview;$('#resetPage').onclick=()=>confirmReset(false);$('#revert').onclick=()=>{dialogAction=()=>{draft[scope]=clone(saved[scope]);lastTest={};close();render();toast('已放棄目前範圍的未儲存變更。')};show('放棄變更','<p>只放棄「'+scopeNames[scope]+'」尚未儲存的變更；其他範圍會保留。</p>','<button data-close>返回</button><button data-confirm class="danger">放棄此範圍變更</button>')};$('#export').onclick=download;$('#closeDialog').onclick=close;$('#dialog').addEventListener('cancel',e=>{e.preventDefault();close()});$('#importFile').onchange=e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>1024*1024){show('無法匯入','<p>設定檔超過 1 MiB，請檢查內容。</p>');return}const reader=new FileReader();reader.onload=()=>importText(String(reader.result));reader.onerror=()=>show('無法讀取設定檔','<p>目前設定保持不變，請重新選擇檔案。</p>');reader.readAsText(file);e.target.value=''};
