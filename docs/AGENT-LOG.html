<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Log · VGenAxIs 工項燈號板</title>
<!-- BOARD-DISPATCH-01 §6.3 / INV-BD-35..38: read-only, black-background log page for one Agent lane.
     Served by docs/board_watch.py at /agent-log?lane=L1[&run=<runId>]. No controls, no token, no storage. -->
<style>
:root {
  --bg: #0a0a0a;
  --panel: #141414;
  --line: #2a2a2a;
  --fg: #d6d6d6;
  --dim: #9da3a8;
  --ok: #7ee787;
  --warn: #e3b341;
  --err: #ff8a80;
  --focus: #79c0ff;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Cascadia Mono", Consolas, "Noto Sans Mono CJK TC", "Microsoft JhengHei", monospace; font-size: 13px; display: flex; flex-direction: column; }
header { flex: none; padding: 10px 14px 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { margin: 0 0 8px; font-size: 15px; font-weight: 600; color: var(--ok); }
.ctl { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.ctl label { color: var(--dim); }
select, button, a.back { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
button { cursor: pointer; }
button[aria-pressed="true"] { border-color: var(--warn); color: var(--warn); }
a.back { text-decoration: none; }
select:focus-visible, button:focus-visible, a.back:focus-visible, pre:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
select:disabled, button:disabled { opacity: .5; cursor: not-allowed; }
dl.meta { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 8px 0 0; }
dl.meta div { display: flex; gap: 6px; min-width: 0; }
dl.meta dt { color: var(--dim); }
dl.meta dd { margin: 0; overflow-wrap: anywhere; }
#laneState[data-s="running"], #laneState[data-s="stopping"] { color: var(--warn); }
#laneState[data-s="idle"] { color: var(--ok); }
#laneState[data-s="error"] { color: var(--err); }
#reportInfo[data-s="ok"] { color: var(--ok); }
#reportInfo[data-s="wait"] { color: var(--warn); }
#reportInfo[data-s="err"], #reportInfo[data-s="none"] { color: var(--err); }
#logStatus { margin: 6px 0 0; color: var(--dim); min-height: 1.4em; overflow-wrap: anywhere; }
#logStatus.err { color: var(--err); }
#detachedNote { margin: 6px 0 0; padding: 6px 10px; border: 1px solid var(--warn); border-radius: 6px; color: var(--warn); overflow-wrap: anywhere; }
main { flex: 1 1 auto; min-height: 0; display: flex; }
#logOut { flex: 1 1 auto; margin: 0; padding: 10px 14px 24px; overflow: auto; background: var(--bg); color: var(--fg); font-family: inherit; font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <h1>Agent Log <span id="titleLane"></span></h1>
  <div class="ctl">
    <label for="laneSel">Agent</label>
    <select id="laneSel" disabled></select>
    <label for="runSel">輪次</label>
    <select id="runSel" disabled></select>
    <button type="button" id="pauseBtn" aria-pressed="false">暫停自動捲動</button>
    <a class="back" href="/#agents">回到看板</a>
  </div>
  <dl class="meta">
    <div><dt>CLI</dt><dd id="laneAgent">—</dd></div>
    <div><dt>狀態</dt><dd id="laneState">—</dd></div>
    <div><dt>卡片</dt><dd id="laneCard">—</dd></div>
    <div><dt>經過</dt><dd id="laneElapsed">—</dd></div>
    <div><dt>回報</dt><dd id="reportInfo">—</dd></div>
  </dl>
  <p id="logStatus" role="status" aria-live="polite">載入中…</p>
  <p id="detachedNote" role="note" hidden></p>
</header>
<main>
  <pre id="logOut" role="log" tabindex="0" aria-label="Agent CLI 輸出（唯讀）"></pre>
</main>
<script>
(function () {
  'use strict';
  var POLL_MS = 1000, STATE_MS = 2000, BUF_CAP = 400 * 1024;
  var LANE_STATE = { idle: '閒置', running: '執行中', stopping: '停止中', error: '錯誤', empty: '無卡' };
  var OUTCOME = { done: '完成', blocked: '卡住', 'no-report': '沒回報', timeout: '逾時', terminated: '已終止',
    'server-shutdown': '伺服器關閉', orphaned: '孤兒輪次', 'auth-error': '未登入', 'quota-error': '額度用完', 'launch-error': '無法啟動' };
  function $(id) { return document.getElementById(id); }
  var out = $('logOut'), laneSel = $('laneSel'), runSel = $('runSel'), pauseBtn = $('pauseBtn');
  var params = new URLSearchParams(location.search);
  var view = { lane: params.get('lane') || '', run: params.get('run') || '', snap: null, fetchedAt: 0,
    buf: '', so: 0, se: 0, runId: null, polling: false, gen: 0, runDone: false };
  var paused = false;

  function setText(id, text) { var n = $(id); if (n.textContent !== text) n.textContent = text; }
  function setStatus(text, isErr) { var n = $('logStatus'); n.className = isErr ? 'err' : ''; setText('logStatus', text); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmtDur(s) { s = Math.max(0, Math.floor(s || 0)); var m = Math.floor(s / 60); return (m >= 60 ? Math.floor(m / 60) + ':' + pad(m % 60) : m) + ':' + pad(s % 60); }
  function getJson(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      return r.text().then(function (txt) {
        var j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) { j = null; }
        if (!r.ok) { var err = new Error((j && j.error) || ('HTTP ' + r.status)); err.status = r.status; throw err; }
        return j;
      });
    });
  }
  function agentLabel(id) {
    var a = ((view.snap && view.snap.agents) || []).filter(function (x) { return x.id === id; })[0];
    return a ? a.label : (id || '—');
  }
  function laneOf(id) { return ((view.snap && view.snap.lanes) || []).filter(function (l) { return l.id === id; })[0] || null; }
  function historyOf(runId) { return ((view.snap && view.snap.history) || []).filter(function (h) { return h.runId === runId; })[0] || null; }

  function syncUrl() {
    var q = new URLSearchParams();
    if (view.lane) q.set('lane', view.lane);
    if (view.run) q.set('run', view.run);
    try { history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString() : '')); } catch (e) { /* 沙箱可能不允許 */ }
    document.title = 'Agent Log' + (view.lane ? ' · ' + view.lane : '') + ' · VGenAxIs 工項燈號板';
    setText('titleLane', view.lane ? '· Agent ' + view.lane + (view.run ? '（過去輪次）' : '') : '');
  }
  function resetLog() {
    view.gen += 1; view.buf = ''; view.so = 0; view.se = 0; view.runId = null; view.polling = false; view.runDone = false;
    out.textContent = '';
  }

  function fillLaneSel() {
    var lanes = (view.snap && view.snap.lanes) || [], sig = lanes.map(function (l) { return l.id; }).join(',');
    if (laneSel.getAttribute('data-sig') !== sig) {
      laneSel.setAttribute('data-sig', sig); laneSel.textContent = '';
      lanes.forEach(function (l) { var o = document.createElement('option'); o.value = l.id; o.textContent = 'Agent ' + l.id; laneSel.appendChild(o); });
      if (view.lane && !laneOf(view.lane)) {
        var gone = document.createElement('option'); gone.value = view.lane; gone.textContent = 'Agent ' + view.lane + '（已移除）'; laneSel.appendChild(gone);
      }
    }
    laneSel.value = view.lane; laneSel.disabled = !laneSel.options.length;
  }
  // History written before lanes existed has no laneId; that dispatcher only ever ran L1.
  function runLane(h) { return h.laneId || 'L1'; }
  function fillRunSel() {
    var hist = ((view.snap && view.snap.history) || []).filter(function (h) { return runLane(h) === view.lane; });
    var sig = view.lane + '|' + hist.map(function (h) { return h.runId; }).join(',') + '|' + view.run;
    if (runSel.getAttribute('data-sig') === sig) return;
    runSel.setAttribute('data-sig', sig); runSel.textContent = '';
    var live = document.createElement('option'); live.value = ''; live.textContent = '目前 / 最新輪次（即時）'; runSel.appendChild(live);
    var listed = false;
    hist.forEach(function (h) {
      var o = document.createElement('option'); o.value = h.runId;
      o.textContent = h.cardId + ' · ' + (OUTCOME[h.outcome] || h.outcome) + ' · ' + (h.startedAt || '').replace('T', ' ').slice(0, 19);
      if (h.runId === view.run) listed = true;
      runSel.appendChild(o);
    });
    if (view.run && !listed) { var x = document.createElement('option'); x.value = view.run; x.textContent = view.run; runSel.appendChild(x); }
    runSel.value = view.run; runSel.disabled = !view.lane;
  }

  function renderMeta() {
    if (!view.snap) return;
    if (view.run) {
      var h = historyOf(view.run), lane = laneOf(view.lane), live = lane && lane.current && lane.current.runId === view.run;
      setText('laneAgent', agentLabel(h ? h.agent : (live ? lane.current.agent : '')));
      var st = $('laneState'), key = live ? 'running' : 'past';
      st.setAttribute('data-s', key); setText('laneState', live ? '執行中（此輪）' : (h ? '已結束 · ' + (OUTCOME[h.outcome] || h.outcome) : '過去輪次'));
      setText('laneCard', h ? h.cardId + '「' + (h.title || '') + '」' : (live ? lane.current.cardId + '「' + (lane.current.cardTitle || '') + '」' : view.run));
      setText('laneElapsed', h ? fmtDur(h.durationSec) : (live ? fmtDur((lane.current.elapsedSec || 0) + (Date.now() - view.fetchedAt) / 1000) : '—'));
      return;
    }
    var ln = laneOf(view.lane);
    if (!ln) { setText('laneAgent', '—'); setText('laneState', '—'); setText('laneCard', '—'); setText('laneElapsed', '—'); return; }
    var c = ln.current, s = ln.session;
    var k = c ? (ln.state === 'stopping' ? 'stopping' : 'running') : (ln.state === 'error' ? 'error' : (ln.stopReason === 'no-candidates' ? 'empty' : (ln.state === 'running' ? 'running' : 'idle')));
    setText('laneAgent', agentLabel(c ? c.agent : (s ? s.agent : ln.agent)));
    var stn = $('laneState'); stn.setAttribute('data-s', k);
    setText('laneState', LANE_STATE[k] + (k === 'error' && ln.error ? '：' + ln.error : (k === 'idle' && ln.stopLabel ? '（' + ln.stopLabel + '）' : '')));
    setText('laneCard', c ? c.cardId + '「' + (c.cardTitle || '') + '」' : (ln.lastRun ? '上一輪 ' + ln.lastRun.cardId + '「' + (ln.lastRun.cardTitle || '') + '」' : '—'));
    setText('laneElapsed', c ? fmtDur((c.elapsedSec || 0) + (Date.now() - view.fetchedAt) / 1000) + '（逾時 ' + c.timeoutMinutes + ' 分鐘）' : '—');
  }

  function refreshState() {
    return getJson('/api/dispatch').then(function (snap) {
      if (!snap || !snap.enabled) { setStatus('伺服器沒有啟用派工器：' + ((snap && snap.reason) || '未設定') + '。', true); return; }
      if (!snap.lanes) { setStatus('看板伺服器是舊版：請關閉「HoneyBadger board server」視窗後重新雙擊 tools\\board\\start-board.cmd。', true); return; }
      view.snap = snap; view.fetchedAt = Date.now();
      if (!view.lane && view.run) { var h = historyOf(view.run); if (h) view.lane = runLane(h); }
      if (!view.lane && snap.lanes.length) view.lane = snap.lanes[0].id;
      fillLaneSel(); fillRunSel(); renderMeta(); syncUrl();
      if (!snap.lanes.length) setStatus('還沒有 Agent：到看板的「Agent 派工」分頁新增一條。', false);
    }).catch(function (e) {
      setStatus(e && e.status === 404 ? '看板伺服器是舊版（沒有 Log 頁需要的 API）：請重新雙擊 tools\\board\\start-board.cmd。'
        : '讀不到派工狀態：看板伺服器未啟動？請雙擊 tools\\board\\start-board.cmd。', true);
    });
  }

  function outputUrl() {
    var q = '/output?stdout=' + view.so + '&stderr=' + view.se;
    return view.run ? '/api/dispatch/runs/' + encodeURIComponent(view.run) + q
      : '/api/dispatch/lanes/' + encodeURIComponent(view.lane) + q;
  }
  /* INV-BD-42: a window agent (Antigravity) works in its own IDE window; only its launcher's output lands here. */
  function showDetached(o) {
    var n = $('detachedNote');
    if (!o.detached) { n.hidden = true; return; }
    var h = historyOf(o.runId), ln = laneOf(view.lane), c = ln && ln.current && ln.current.runId === o.runId ? ln.current : null;
    setText('detachedNote', '此 Agent 在 ' + agentLabel((h && h.agent) || (c && c.agent) || '') + ' 視窗中執行，輸出請看該視窗。'
      + '下方只有啟動器的輸出；這張卡只在 Agent 寫回報檔（或執行 board.py report）或逾時才結束。Prompt 檔：' + o.promptFile);
    n.hidden = false;
  }
  /* INV-BD-43/44: which channel delivered the report — 回報檔 / 輸出標記 / board.py report. */
  var CHANNEL = { file: '回報檔', marker: '輸出標記', cli: 'board.py report' };
  function showReport(o) {
    var n = $('reportInfo'), key, text;
    if (!o.runId) { key = ''; text = '—'; }
    else if (o.reportChannel) { key = 'ok'; text = '已回報，經由' + (CHANNEL[o.reportChannel] || o.reportChannel); }
    else if (o.reportError) { key = 'err'; text = '回報檔無效：' + o.reportError + '（' + o.reportFile + '）'; }
    else if (o.running) { key = 'wait'; text = '等待回報（回報檔 ' + o.reportFile + '）'; }
    else { key = 'none'; text = '沒有回報'; }
    n.setAttribute('data-s', key); setText('reportInfo', text);
  }
  function show(o) {
    var meta = o.runId ? '輪次 ' + o.runId + ' · ' + o.cardId + (o.running ? ' · 執行中' : ' · 已結束') + (paused ? ' · 自動捲動已暫停' : '')
      : '這條 Agent 還沒有執行紀錄。';
    setStatus(meta, false);
    showDetached(o);
    showReport(o);
    var shown = view.buf || '（尚無輸出）';
    if (out.textContent !== shown) {
      out.textContent = shown;
      if (!paused) out.scrollTop = out.scrollHeight;
    }
  }
  function poll() {
    if (view.polling || view.runDone || (!view.lane && !view.run)) return;
    view.polling = true;
    var gen = view.gen;
    getJson(outputUrl()).then(function (o) {
      if (gen !== view.gen) return;
      view.polling = false;
      if (o.runId !== view.runId) {
        var stale = view.so || view.se;
        view.runId = o.runId; view.buf = ''; view.so = 0; view.se = 0;
        if (stale) { show(o); return; }  /* 用舊輪次的位移讀到新輪次：下一秒從頭讀 */
      }
      var add = '';
      if (o.stdout.truncated || o.stderr.truncated) add += '…（前段輸出過長，已略過）\n';
      add += o.stdout.text + o.stderr.text;
      view.so = o.stdout.next; view.se = o.stderr.next;
      if (add) { view.buf += add; if (view.buf.length > BUF_CAP) view.buf = view.buf.slice(view.buf.length - BUF_CAP); }
      if (view.run && !o.running && !add) view.runDone = true;  /* 過去輪次讀完就不再輪詢 */
      show(o);
    }).catch(function (e) {
      if (gen !== view.gen) return;
      view.polling = false;
      setStatus(e && e.status === 404 ? (view.run ? '找不到這個輪次的紀錄（可能已超出最近 50 筆）。' : '找不到 Agent ' + view.lane + '（可能已被移除）。')
        : '讀取輸出失敗：' + (e && e.message ? e.message : '連線中斷'), true);
    });
  }

  function bind() {
    laneSel.addEventListener('change', function () { view.lane = laneSel.value; view.run = ''; resetLog(); fillRunSel(); renderMeta(); syncUrl(); poll(); });
    runSel.addEventListener('change', function () { view.run = runSel.value; resetLog(); renderMeta(); syncUrl(); poll(); });
    pauseBtn.addEventListener('click', function () {
      paused = !paused;
      pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
      pauseBtn.textContent = paused ? '恢復自動捲動' : '暫停自動捲動';
      if (!paused) out.scrollTop = out.scrollHeight;
    });
  }

  if (!/^https?:$/.test(location.protocol)) {
    pauseBtn.disabled = true;
    setStatus('這一頁要從看板伺服器開：請雙擊 tools\\board\\start-board.cmd，再從「Agent 派工」分頁按「開啟 Log」。', true);
    return;
  }
  bind();
  syncUrl();
  refreshState().then(poll);
  setInterval(refreshState, STATE_MS);
  setInterval(renderMeta, 1000);
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
