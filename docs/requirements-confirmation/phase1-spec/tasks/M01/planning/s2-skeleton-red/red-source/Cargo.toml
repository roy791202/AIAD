[package]
name = "sgenaxis-host"
version = "0.1.0"
description = "SGenAxis HOST — lifecycle, settings store, restricted IPC (no arbitrary shell)"
edition = "2021"
rust-version = "1.77.2"
license = "MIT OR Apache-2.0"

[features]
default = ["std-adapters"]
## Forward adapters Std FS/Path/Process/Git for production boot.
std-adapters = ["sgenaxis-adapters/std-adapters"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sgenaxis-ports = { path = "../sgenaxis-ports" }
sgenaxis-adapters = { path = "../sgenaxis-adapters", default-features = false }
# PD-SET-01: CLI／MCP agent settings document + projection (secrets omitted)
sgenaxis-exec = { path = "../sgenaxis-exec" }
# PD-GUARD-CMD-01: envelope／path gate façade for commands／EXEC start
sgenaxis-guard = { path = "../sgenaxis-guard" }
sgenaxis-spec = { path = "../sgenaxis-spec" }
sgenaxis-work = { path = "../sgenaxis-work" }

[dev-dependencies]
