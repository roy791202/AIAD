name: Rust baseline gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Record runtime versions
        run: |
          python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate baseline gate
        run: python -m unittest discover -s tests -p test_rust_baseline_gate.py -v
      - name: Build native fixture helpers
        working-directory: apps/sgenaxis-desktop
        shell: pwsh
        run: |
          cargo build -p sgenaxis-adapters --example file_commit_probe --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifacts = cargo test -p sgenaxis-adapters --example file_commit_probe --no-run --message-format=json --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $helper = $artifacts | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.executable } | Select-Object -Last 1
          if (-not $helper -or -not (Test-Path -LiteralPath $helper.executable)) { throw 'checkpoint helper missing' }
          $normal = (Resolve-Path 'target/debug/examples/file_commit_probe.exe').Path
          "FILE_COMMIT_PROBE_PATH=$normal" >> $env:GITHUB_ENV
          "FILE_COMMIT_CHECKPOINT_PROBE_PATH=$($helper.executable)" >> $env:GITHUB_ENV
      - name: Rust workspace
        working-directory: apps/sgenaxis-desktop
        run: cargo test --workspace --locked
      - name: EXEC feature matrix
        working-directory: apps/sgenaxis-desktop
        run: cargo test -p sgenaxis-exec --all-features --lib --locked
      - name: Independent Tauri host
        working-directory: apps/sgenaxis-desktop/src-tauri
        run: cargo test --lib --locked
      - name: Install acceptance fixture tools
        run: |
          python -m pip install pytest==9.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tool install --global wix --version 7.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build real packaging fixture source
        working-directory: apps/sgenaxis-desktop/src-tauri
        run: cargo build --release --locked
      - name: Prepare isolated real MSI fixture
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'pr1-packaging-fixture'
          python scripts/prepare_packaging_test_fixture.py --output $fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SGENAXIS_PACKAGING_TEST_ROOT=$fixture" >> $env:GITHUB_ENV
      - name: Retained acceptance and guard tests
        run: python -m pytest tests/test_added_test_disables.py tests/test_pd_live_cli_smoke_01.py tests/test_pd_m2_e2e_loop_01.py tests/test_pd_mcp_live_smoke_01.py tests/test_pd_rel_02_wix.py tests/test_pd_release_rec_01.py -q
