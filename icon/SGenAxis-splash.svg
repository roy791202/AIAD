<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>SGenAxis Splash Screen</title>
  <desc>Minimal cute robot mascot, SGenAxis wordmark, and an empty outlined loading bar. No status text.</desc>
  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20C8F2"/>
      <stop offset="1" stop-color="#2BA8F4"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#367BFF"/>
      <stop offset="1" stop-color="#2453EA"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="#FFFFFF"/>

  <!-- Robot antenna -->
  <g stroke="#102451" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 190 V145" stroke-width="18" fill="none"/>
    <circle cx="512" cy="118" r="34" fill="#102451" stroke="none"/>
    <circle cx="512" cy="118" r="19" fill="url(#cyan)" stroke="none"/>

    <!-- Side pods -->
    <path d="M332 340 C285 350 270 390 275 431 C279 466 301 489 333 493" fill="#FFFFFF" stroke-width="18"/>
    <path d="M692 340 C739 350 754 390 749 431 C745 466 723 489 691 493" fill="#FFFFFF" stroke-width="18"/>

    <!-- Head shell -->
    <rect x="326" y="190" width="372" height="328" rx="112" fill="#FFFFFF" stroke-width="18"/>
    <!-- Face screen -->
    <rect x="365" y="244" width="294" height="224" rx="72" fill="url(#cyan)" stroke-width="16"/>

    <!-- Smiling eyes and mouth -->
    <path d="M413 342 Q434 309 455 342" fill="none" stroke-width="17"/>
    <path d="M569 342 Q590 309 611 342" fill="none" stroke-width="17"/>
    <path d="M490 371 Q512 393 534 371" fill="none" stroke-width="17"/>

    <!-- Body -->
    <path d="M405 515 C390 544 372 566 368 590 C364 610 380 621 396 607 L427 579" fill="#FFFFFF" stroke-width="17"/>
    <path d="M619 515 C634 544 652 566 656 590 C660 610 644 621 628 607 L597 579" fill="#FFFFFF" stroke-width="17"/>
    <path d="M421 505 Q512 538 603 505 L617 589 Q612 637 567 646 L457 646 Q412 637 407 589 Z" fill="#FFFFFF" stroke-width="17"/>
    <path d="M437 640 Q433 681 459 687 Q483 691 487 650" fill="#FFFFFF" stroke-width="17"/>
    <path d="M537 650 Q541 691 565 687 Q591 681 587 640" fill="#FFFFFF" stroke-width="17"/>
    <ellipse cx="512" cy="704" rx="133" ry="10" fill="#DCEEFF" stroke="none"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, Avenir Next, Montserrat, Arial, sans-serif" font-size="94" font-weight="750" text-anchor="middle" letter-spacing="-3">
    <text x="512" y="824" fill="#102451">SGen<tspan fill="#2D6CF5">A</tspan>xis</text>
  </g>
  <circle cx="516" cy="799" r="7" fill="#20C8F2"/>

  <!-- Empty outlined progress bar: intentionally no fill and no status text -->
  <rect x="340" y="884" width="344" height="16" rx="8" fill="none" stroke="#DCE8FA" stroke-width="4"/>
</svg>