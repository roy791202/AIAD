<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" fill="none"
     xmlns="http://www.w3.org/2000/svg">
  <title>Qt Style UI Icon</title>
  <desc>Flat desktop UI icon suitable for Qt toolbar or application actions.</desc>

  <!-- Background rounded tile -->
  <rect x="24" y="24" width="208" height="208" rx="36"
        fill="#F4F7FA" stroke="#AEB8C2" stroke-width="8"/>

  <!-- Main window frame -->
  <rect x="54" y="62" width="148" height="116" rx="14"
        fill="#FFFFFF" stroke="#3A4A5A" stroke-width="8"/>

  <!-- Title bar -->
  <path d="M68 62H188C195.732 62 202 68.268 202 76V94H54V76C54 68.268 60.268 62 68 62Z"
        fill="#4E9A51" stroke="#3A4A5A" stroke-width="8"/>

  <!-- Window controls -->
  <circle cx="74" cy="78" r="5" fill="#FFFFFF"/>
  <circle cx="91" cy="78" r="5" fill="#FFFFFF"/>
  <circle cx="108" cy="78" r="5" fill="#FFFFFF"/>

  <!-- UI layout blocks -->
  <rect x="72" y="112" width="42" height="48" rx="6"
        fill="#E9EEF3" stroke="#6F7F8F" stroke-width="6"/>
  <rect x="128" y="112" width="54" height="14" rx="5"
        fill="#C9D3DD"/>
  <rect x="128" y="137" width="42" height="14" rx="5"
        fill="#C9D3DD"/>

  <!-- Cursor / interaction pointer -->
  <path d="M141 160L184 204L166 208L156 230L141 160Z"
        fill="#FFFFFF" stroke="#3A4A5A" stroke-width="8"
        stroke-linejoin="round"/>
  <path d="M166 196L188 218"
        stroke="#3A4A5A" stroke-width="8"
        stroke-linecap="round"/>
</svg>
