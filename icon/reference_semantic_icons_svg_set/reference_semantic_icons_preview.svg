<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="168" viewBox="0 0 210 42">
<defs>
  <style>
    .bg{fill:#2F2F2F}
    .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:3.2px;fill:#D7DEE8;text-anchor:middle}
    .line{fill:none;stroke:#D7DEE8;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
    .thin{fill:none;stroke:#D7DEE8;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
    .fill{fill:#D7DEE8;stroke:none}
    .muted{fill:none;stroke:#7F8896;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
    .accent{fill:none;stroke:#62A8FF;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .accentFill{fill:#62A8FF;stroke:none}
    .danger{fill:none;stroke:#FF6B6B;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="bg" x="0" y="0" width="210" height="42" rx="3"/>
<g transform="translate(8,5) scale(1)">
  
  <!-- Semantic: an external scene tile bound to the local project through a reference link. -->
  <rect class="line" x="3.1" y="5.0" width="9.8" height="9.8" rx="1.7"/>
  <circle class="fill" cx="5.9" cy="8.2" r=".9"/>
  <circle class="fill" cx="9.9" cy="8.2" r=".9"/>
  <circle class="fill" cx="7.9" cy="11.55" r=".9"/>
  <path class="thin" d="M6.7 8.65 L7.45 10.65 M9.2 8.65 L8.35 10.65"/>
  <path class="accent" d="M13.2 10.25 H16.2 C17.15 10.25 17.95 11.05 17.95 12.0 V14.0"/>
  <rect class="accent" x="15.0" y="14.1" width="5.9" height="4.9" rx="1.2"/>
  <path class="accent" d="M16.75 16.55 H19.15"/>

</g>
<text class="label" x="20" y="35">Reference</text>
<g transform="translate(37,5) scale(1)">
  
  <!-- Semantic: external scene capsule linked into local graph; plus means establish a new reference. -->
  <rect class="line" x="3.2" y="5.2" width="10.8" height="10.8" rx="1.8"/>
  <circle class="fill" cx="6.4" cy="8.6" r="1.05"/>
  <circle class="fill" cx="10.7" cy="8.6" r="1.05"/>
  <circle class="fill" cx="8.55" cy="12.4" r="1.05"/>
  <path class="thin" d="M7.35 9.2 L8.1 11.35 M9.75 9.2 L8.95 11.35"/>
  <path class="accent" d="M14.2 10.6 H17.2 C18.1 10.6 18.85 11.35 18.85 12.25 V13.1"/>
  <circle class="accent" cx="18.85" cy="15.45" r="2.55"/>
  <path class="accent" d="M18.85 14.05 V16.85 M17.45 15.45 H20.25"/>

</g>
<text class="label" x="49" y="35">Add Ref</text>
<g transform="translate(66,5) scale(1)">
  
  <!-- Semantic: unresolved reference becomes active/realized in the local scene graph. -->
  <rect class="muted" x="3.0" y="4.7" width="8.8" height="8.8" rx="1.6"/>
  <circle class="fill" cx="5.6" cy="7.6" r=".85"/>
  <circle class="fill" cx="9.2" cy="7.6" r=".85"/>
  <circle class="fill" cx="7.4" cy="10.7" r=".85"/>
  <path class="thin" d="M6.35 8.05 L7.05 9.85 M8.55 8.05 L7.75 9.85"/>
  <path class="accent" d="M12.4 9.1 H15.6 C16.8 9.1 17.8 10.1 17.8 11.3 V13.55"/>
  <rect class="line" x="12.4" y="13.6" width="8.6" height="5.9" rx="1.3"/>
  <path class="accent" d="M14.5 16.45 L16.2 18.05 L19.1 15.15"/>

</g>
<text class="label" x="78" y="35">Load</text>
<g transform="translate(95,5) scale(1)">
  
  <!-- Semantic: live scene link is detached; the reference record remains as an offline proxy. -->
  <rect class="line" x="3.2" y="5.0" width="9.5" height="9.5" rx="1.6"/>
  <circle class="fill" cx="5.9" cy="8.0" r=".88"/>
  <circle class="fill" cx="9.6" cy="8.0" r=".88"/>
  <circle class="fill" cx="7.75" cy="11.2" r=".88"/>
  <path class="thin" d="M6.65 8.45 L7.35 10.35 M8.95 8.45 L8.15 10.35"/>
  <path class="muted" d="M13.0 9.75 H16.0 C16.9 9.75 17.65 10.5 17.65 11.4"/>
  <path class="danger" d="M15.0 14.05 L20.6 19.65 M20.6 14.05 L15.0 19.65"/>
  <path class="muted" d="M17.8 12.7 V13.4"/>

</g>
<text class="label" x="107" y="35">Unload</text>
<g transform="translate(124,5) scale(1)">
  
  <!-- Semantic: preserve one reference binding while swapping its source asset. -->
  <rect class="line" x="2.8" y="5.4" width="7.4" height="7.4" rx="1.3"/>
  <circle class="fill" cx="5.0" cy="7.85" r=".72"/>
  <circle class="fill" cx="8.0" cy="7.85" r=".72"/>
  <circle class="fill" cx="6.5" cy="10.35" r=".72"/>
  <rect class="line" x="13.8" y="11.2" width="7.4" height="7.4" rx="1.3"/>
  <circle class="fill" cx="16.0" cy="13.65" r=".72"/>
  <circle class="fill" cx="19.0" cy="13.65" r=".72"/>
  <circle class="fill" cx="17.5" cy="16.15" r=".72"/>
  <path class="accent" d="M10.6 7.9 H15.7"/>
  <path class="accent" d="M14.3 6.55 L15.9 7.9 L14.3 9.25"/>
  <path class="accent" d="M13.4 16.1 H8.3"/>
  <path class="accent" d="M9.7 14.75 L8.1 16.1 L9.7 17.45"/>

</g>
<text class="label" x="136" y="35">Replace</text>
<g transform="translate(153,5) scale(1)">
  
  <!-- Semantic: delete the reference relationship itself, not the external asset. -->
  <rect class="line" x="3.2" y="5.0" width="9.4" height="9.4" rx="1.6"/>
  <circle class="fill" cx="5.9" cy="8.0" r=".85"/>
  <circle class="fill" cx="9.4" cy="8.0" r=".85"/>
  <circle class="fill" cx="7.65" cy="11.15" r=".85"/>
  <path class="thin" d="M6.6 8.45 L7.2 10.25 M8.75 8.45 L8.05 10.25"/>
  <path class="danger" d="M13.3 10.1 C14.25 9.2 15.75 9.25 16.65 10.2"/>
  <path class="danger" d="M17.8 11.35 C18.75 12.3 18.7 13.8 17.75 14.7"/>
  <path class="danger" d="M14.9 12.95 L20.2 18.25 M20.2 12.95 L14.9 18.25"/>

</g>
<text class="label" x="165" y="35">Remove</text>
<g transform="translate(182,5) scale(1)">
  
  <!-- Semantic: many reference bindings resynchronize from their external sources. -->
  <rect class="line" x="4.0" y="4.5" width="7.2" height="7.2" rx="1.25"/>
  <rect class="line" x="12.8" y="4.5" width="7.2" height="7.2" rx="1.25"/>
  <rect class="line" x="8.4" y="12.3" width="7.2" height="7.2" rx="1.25"/>
  <path class="thin" d="M6.1 8.0 H9.0 M14.9 8.0 H17.8 M10.5 15.8 H13.4"/>
  <path class="accent" d="M7.6 3.1 C10.6 1.65 14.3 1.95 17.0 4.0"/>
  <path class="accent" d="M16.7 2.0 L17.25 4.15 L15.05 4.35"/>
  <path class="accent" d="M16.4 20.9 C13.4 22.35 9.7 22.05 7.0 20.0"/>
  <path class="accent" d="M7.3 22.0 L6.75 19.85 L8.95 19.65"/>

</g>
<text class="label" x="194" y="35">Reload All</text>
</svg>
