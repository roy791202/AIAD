<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>SGenAxis Robot Logo</title>
  <desc>Minimal cute robot mascot with oval eyes and no mouth, above the SGenAxis wordmark.</desc>
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <defs>
    <linearGradient id="lavender" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8D0FF"/>
      <stop offset="1" stop-color="#BBA8FF"/>
    </linearGradient>
  </defs>

  <g stroke="#10265B" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Antenna and signal -->
    <path d="M512 205 V160" fill="none"/>
    <circle cx="512" cy="129" r="36" fill="#10265B" stroke="none"/>
    <circle cx="512" cy="129" r="21" fill="url(#lavender)" stroke="none"/>
    <path d="M512 65 V43 M444 88 L427 71 M580 88 L597 71" fill="none" stroke="#9C82FF" stroke-width="14"/>

    <!-- Side ear pods -->
    <path d="M353 345 C310 356 294 392 299 437 C303 471 323 494 358 500" fill="#FFFFFF"/>
    <path d="M671 345 C714 356 730 392 725 437 C721 471 701 494 666 500" fill="#FFFFFF"/>
    <path d="M326 386 V458 M698 386 V458" fill="none" stroke="#C8B8FF" stroke-width="9"/>

    <!-- Head shell -->
    <rect x="340" y="205" width="344" height="326" rx="108" fill="#FFFFFF"/>
    <!-- Face panel -->
    <rect x="380" y="263" width="264" height="213" rx="67" fill="url(#lavender)" stroke="none"/>

    <!-- Oval eyes, deliberately no mouth -->
    <ellipse cx="461" cy="365" rx="20" ry="32" fill="#10265B" stroke="none"/>
    <ellipse cx="563" cy="365" rx="20" ry="32" fill="#10265B" stroke="none"/>
    <ellipse cx="466" cy="353" rx="7" ry="10" fill="#FFFFFF" stroke="none"/>
    <ellipse cx="568" cy="353" rx="7" ry="10" fill="#FFFFFF" stroke="none"/>

    <!-- Neck/body -->
    <path d="M420 531 L420 557 M604 531 L604 557" fill="none"/>
    <path d="M420 557 Q512 591 604 557" fill="none" stroke="#C8B8FF" stroke-width="13"/>

    <!-- Arms -->
    <path d="M405 563 C377 585 357 614 355 641 C354 662 372 675 390 660 L425 627" fill="#FFFFFF"/>
    <path d="M619 563 C647 585 667 614 669 641 C670 662 652 675 634 660 L599 627" fill="#FFFFFF"/>

    <!-- Body -->
    <path d="M425 548 Q512 580 599 548 L614 648 Q610 693 570 705 L454 705 Q414 693 410 648 Z" fill="#FFFFFF"/>
    <rect x="471" y="558" width="82" height="57" rx="24" fill="url(#lavender)" stroke="none"/>

    <!-- Feet -->
    <path d="M435 693 Q426 735 454 744 Q482 751 492 710" fill="#FFFFFF"/>
    <path d="M532 710 Q542 751 570 744 Q598 735 589 693" fill="#FFFFFF"/>
    <path d="M450 730 Q462 738 474 730 M550 730 Q562 738 574 730" fill="none" stroke="#BBA8FF" stroke-width="8"/>
  </g>

  <!-- Wordmark -->
  <text x="512" y="855" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="700"
        letter-spacing="-3" fill="#10265B">SGen<tspan fill="#9C82FF">A</tspan>xis</text>
  <circle cx="516" cy="827" r="7" fill="#10265B"/>
</svg>