<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
  <title>SGenAxis logo</title>
  <desc>Minimal cute robot mascot above the SGenAxis wordmark.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3678FF"/>
      <stop offset="1" stop-color="#2448E8"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16D6E8"/>
      <stop offset="1" stop-color="#22B8F4"/>
    </linearGradient>
  </defs>

  <!-- Transparent background -->
  <g id="mascot" stroke-linecap="round" stroke-linejoin="round">
    <!-- antenna -->
    <path d="M512 392 V350" fill="none" stroke="#2E67F4" stroke-width="20"/>
    <circle cx="512" cy="326" r="42" fill="url(#blue)"/>
    <circle cx="498" cy="312" r="10" fill="#FFFFFF" opacity=".35"/>

    <!-- ear pieces -->
    <rect x="269" y="474" width="70" height="142" rx="34" fill="url(#blue)"/>
    <rect x="685" y="474" width="70" height="142" rx="34" fill="url(#blue)"/>
    <rect x="283" y="492" width="22" height="105" rx="11" fill="#27C8F1" opacity=".72"/>
    <rect x="719" y="492" width="22" height="105" rx="11" fill="#27C8F1" opacity=".72"/>

    <!-- head shell -->
    <rect x="292" y="374" width="440" height="364" rx="132" fill="#FDFEFF" stroke="#E7EEFF" stroke-width="8"/>
    <path d="M350 408 Q512 364 674 408" fill="none" stroke="#FFFFFF" stroke-width="9" opacity=".9"/>

    <!-- face -->
    <rect x="337" y="435" width="350" height="246" rx="82" fill="#14264F"/>
    <path d="M379 464 Q405 447 426 450" fill="none" stroke="#6D83B5" stroke-width="14" opacity=".45"/>

    <!-- happy eyes -->
    <path d="M406 555 Q432 512 459 555" fill="none" stroke="url(#cyan)" stroke-width="22"/>
    <path d="M565 555 Q592 512 618 555" fill="none" stroke="url(#cyan)" stroke-width="22"/>

    <!-- small cheek highlights -->
    <circle cx="374" cy="603" r="5" fill="#2E67F4" opacity=".55"/>
    <circle cx="650" cy="603" r="5" fill="#2E67F4" opacity=".55"/>

    <!-- tiny friendly sparkle -->
    <path d="M765 405 L775 430 L800 440 L775 450 L765 475 L755 450 L730 440 L755 430 Z" fill="#20C7E8"/>

    <!-- wordmark -->
    <g id="wordmark">
      <text x="512" y="895" text-anchor="middle"
            font-family="Inter, Avenir Next, Montserrat, Arial, sans-serif"
            font-size="116" font-weight="750" letter-spacing="-4" fill="#14264F">SGen<tspan fill="#2F65F5">A</tspan>xis</text>
      <!-- cyan dot accent in stylized A -->
      <circle cx="608" cy="866" r="7.5" fill="#18CBE6"/>
    </g>
  </g>
</svg>