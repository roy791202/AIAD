# PD-CARGO-WORKSPACE-01 — desktop Cargo workspace root
# From this directory: cargo test -p sgenaxis-core (or -p 'sgenaxis-*')
[workspace]
resolver = "2"
members = [
    "crates/sgenaxis-core",
    "crates/sgenaxis-ports",
    "crates/sgenaxis-adapters",
    "crates/sgenaxis-exec",
    "crates/sgenaxis-listen",
    "crates/sgenaxis-guard",
    "crates/sgenaxis-evid",
    "crates/sgenaxis-spec",
    "crates/sgenaxis-work",
    "crates/sgenaxis-host",
]
# Tauri host stays a separate package under src-tauri/ (own Cargo.toml + lock).
# Run its tests from src-tauri: cargo test --lib
default-members = [
    "crates/sgenaxis-core",
    "crates/sgenaxis-ports",
    "crates/sgenaxis-adapters",
    "crates/sgenaxis-exec",
    "crates/sgenaxis-listen",
    "crates/sgenaxis-guard",
    "crates/sgenaxis-evid",
    "crates/sgenaxis-spec",
    "crates/sgenaxis-work",
    "crates/sgenaxis-host",
]
