[package]
name = "sgenaxis-adapters"
version = "0.1.0"
description = "SGenAxis Port adapters — fake + std FS/Path/Process/Deploy + StdGit + approving StdGitWrite"
edition = "2021"
rust-version = "1.77.2"
license = "MIT OR Apache-2.0"

[features]
default = ["std-adapters"]
## Thin `std::fs` / path convention adapters (no extra crates).
std-adapters = []

[dependencies]
sgenaxis-ports = { path = "../sgenaxis-ports" }
sgenaxis-spec = { path = "../sgenaxis-spec" }
roxmltree = "=0.20.0"

[dev-dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Security"] }
