[package]
name = "sgenaxis-adapters"
version = "0.1.0"
description = "SGenAxis Port adapters — fake + std FS/Path/Process/Deploy + StdGit + approving StdGitWrite"
edition = "2021"
rust-version = "1.77.2"
license = "MIT OR Apache-2.0"

[features]
default = ["std-adapters"]
## Thin `std::fs` / path convention adapters (no extra crates).
std-adapters = []

[dependencies]
sgenaxis-ports = { path = "../sgenaxis-ports" }
sgenaxis-spec = { path = "../sgenaxis-spec" }
roxmltree = "=0.20.0"

[dev-dependencies]
