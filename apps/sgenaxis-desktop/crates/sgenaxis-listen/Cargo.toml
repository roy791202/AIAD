[package]
name = "sgenaxis-listen"
version = "0.1.0"
description = "SGenAxis listen bridge — FS／Git／AgentChunk → debounce → DomainEvent／Dirty／Reconcile (PD-LISTEN-01/02/RECON-01)"
edition = "2021"
rust-version = "1.77.2"
license = "MIT OR Apache-2.0"

[features]
default = ["os-notify"]
## Real OS FS watcher via `notify` (Windows ReadDirectoryChanges). macOS/Linux watcher out of scope.
os-notify = ["dep:notify"]

[dependencies]
sgenaxis-core = { path = "../sgenaxis-core" }
sgenaxis-exec = { path = "../sgenaxis-exec" }
notify = { version = "6.1.1", optional = true }

[dev-dependencies]
