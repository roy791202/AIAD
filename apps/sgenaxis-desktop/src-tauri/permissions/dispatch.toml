# PD-CMD-01 — allow Vanilla UI to invoke host dispatch commands (no OS plugins).

[[permission]]
identifier = "allow-list-commands"
description = "Allows list_commands"
commands.allow = ["list_commands"]

[[permission]]
identifier = "allow-get-board"
description = "Allows get_board"
commands.allow = ["get_board"]

[[permission]]
identifier = "allow-load-local-board"
description = "Allows load_local_board (read-only local #board-snapshot; no write-back)"
commands.allow = ["load_local_board"]

[[permission]]
identifier = "allow-upsert-task"
description = "Allows upsert_task"
commands.allow = ["upsert_task"]

[[permission]]
identifier = "allow-set-task-zone"
description = "Allows set_task_zone"
commands.allow = ["set_task_zone"]

[[permission]]
identifier = "allow-start-run"
description = "Allows start_run"
commands.allow = ["start_run"]

[[permission]]
identifier = "allow-poll-chunks"
description = "Allows poll_chunks"
commands.allow = ["poll_chunks"]

[[permission]]
identifier = "allow-cancel-run"
description = "Allows cancel_run"
commands.allow = ["cancel_run"]

[[permission]]
identifier = "allow-get-evidence-summary"
description = "PD-EVID-UI-01 read-only Inspector evidence summary"
commands.allow = ["get_evidence_summary"]

[[permission]]
identifier = "allow-project-pd-report"
description = "PD-REPORT-UI-01 project_pd_report (tools/pd_report call boundary; no SPEC write-back)"
commands.allow = ["project_pd_report"]

[[permission]]
identifier = "allow-guard-check-start"
description = "PD-GUARD-CMD-01 start_implementation gate"
commands.allow = ["guard_check_start"]

[[permission]]
identifier = "allow-guard-check-changes"
description = "PD-GUARD-CMD-01 pre-write path gate"
commands.allow = ["guard_check_changes"]

[[permission]]
identifier = "allow-start-implementation"
description = "PD-GUARD-CMD-01 GUARD pass then EXEC DryRun"
commands.allow = ["start_implementation"]

[[permission]]
identifier = "allow-listen-get-projection"
description = "PD-REMAIN-LISTEN-UI-01 listen_get_projection (FS／Git／Agent; no UI notify)"
commands.allow = ["listen_get_projection"]

[[permission]]
identifier = "allow-arch-get-projection"
description = "PD-REMAIN-ARCH-UI-01 arch_get_projection (module／dependency; no UI-static live fake)"
commands.allow = ["arch_get_projection"]

[[permission]]
identifier = "allow-uidesign-package-status"
description = "PD-SHELL-UIDESIGN-VIEW-01 uidesign_package_status"
commands.allow = ["uidesign_package_status"]

[[permission]]
identifier = "allow-uidesign-open-package"
description = "PD-SHELL-UIDESIGN-VIEW-01 uidesign_open_package"
commands.allow = ["uidesign_open_package"]

[[permission]]
identifier = "allow-uidesign-save-design"
description = "PD-UIDESIGNER-FORMAT-01 uidesign_save_design (.sgendesign via Port)"
commands.allow = ["uidesign_save_design"]

[[permission]]
identifier = "allow-uidesign-load-design"
description = "PD-UIDESIGNER-FORMAT-01 uidesign_load_design"
commands.allow = ["uidesign_load_design"]

[[permission]]
identifier = "allow-uidesign-build-preview"
description = "PD-UIDESIGNER-BUILD-01 uidesign_build_preview (communication HTML)"
commands.allow = ["uidesign_build_preview"]

[[permission]]
identifier = "allow-uidesign-ask-agent"
description = "PD-UIDESIGNER-ASK-01 uidesign_ask_agent (draft ± gray upsert)"
commands.allow = ["uidesign_ask_agent"]

[[permission]]
identifier = "allow-scene-save"
description = "Project-scoped scene_save under scene/ (.ess／.es／.esml／.esui; legacy .sgs／.sg／…)"
commands.allow = ["scene_save"]

[[permission]]
identifier = "allow-scene-load"
description = "Project-scoped scene_load under scene/"
commands.allow = ["scene_load"]

[[set]]
identifier = "dispatch-default"
description = "PD-CMD-01 + PD-BOARD-LIVE-01 + PD-EVID-UI-01 + PD-REPORT-UI-01 + PD-GUARD-CMD-01 + PD-REMAIN-LISTEN-UI-01 + PD-UIDESIGNER-*"
permissions = [
  "allow-list-commands",
  "allow-get-board",
  "allow-load-local-board",
  "allow-upsert-task",
  "allow-set-task-zone",
  "allow-start-run",
  "allow-poll-chunks",
  "allow-cancel-run",
  "allow-get-evidence-summary",
  "allow-project-pd-report",
  "allow-guard-check-start",
  "allow-guard-check-changes",
  "allow-start-implementation",
  "allow-listen-get-projection",
  "allow-arch-get-projection",
  "allow-uidesign-package-status",
  "allow-uidesign-open-package",
  "allow-uidesign-save-design",
  "allow-uidesign-load-design",
  "allow-uidesign-build-preview",
  "allow-uidesign-ask-agent",
  "allow-scene-save",
  "allow-scene-load",
]
