# PD-HOST-01 — lifecycle / settings IPC only (no shell plugin).

[[permission]]
identifier = "allow-host-get-phase"
description = "Allows host_get_phase"
commands.allow = ["host_get_phase"]

[[permission]]
identifier = "allow-host-get-settings"
description = "Allows host_get_settings"
commands.allow = ["host_get_settings"]

[[permission]]
identifier = "allow-host-set-settings"
description = "Allows host_set_settings"
commands.allow = ["host_set_settings"]

[[permission]]
identifier = "allow-host-pick-project-directory"
description = "PD-WIRE-OPEN-01: native folder pick (no domain mutate; UI persists via host_set_settings)"
commands.allow = ["host_pick_project_directory"]

[[permission]]
identifier = "allow-host-new-project-directory"
description = "PD-REMAIN-FILE-NEW-01: native save dialog + create dir via FileSystemPort; UI binds via host_set_settings"
commands.allow = ["host_new_project_directory"]

[[permission]]
identifier = "allow-host-create-project-directory"
description = "PD-BUG-FILE-NEW-01: create project dir under parent+name via FileSystemPort; UI binds via host_set_settings"
commands.allow = ["host_create_project_directory"]

[[permission]]
identifier = "allow-file-save"
description = "PD-REMAIN-FILE-SAVE-01: persist host settings／board path binding only (fixed store; no arbitrary path; no board write-back)"
commands.allow = ["file_save"]

[[permission]]
identifier = "allow-host-request-shutdown"
description = "Allows host_request_shutdown"
commands.allow = ["host_request_shutdown"]

[[permission]]
identifier = "allow-deploy-status"
description = "PD-DEPLOY-CMD-01 read-only deploy_status (no shell／install)"
commands.allow = ["deploy_status"]

[[permission]]
identifier = "allow-deploy-check"
description = "PD-DEPLOY-CMD-01 read-only deploy_check (no elevated /qn auto)"
commands.allow = ["deploy_check"]

[[permission]]
identifier = "allow-list-artifacts"
description = "PD-DEPLOY-CMD-01 list_artifacts (existence probe only)"
commands.allow = ["list_artifacts"]

[[set]]
identifier = "host-default"
description = "PD-HOST-01 + PD-DEPLOY-CMD-01 allowlisted commands (no shell／elevated install)"
permissions = [
  "allow-host-get-phase",
  "allow-host-get-settings",
  "allow-host-set-settings",
  "allow-host-pick-project-directory",
  "allow-host-new-project-directory",
  "allow-host-create-project-directory",
  "allow-file-save",
  "allow-host-request-shutdown",
  "allow-deploy-status",
  "allow-deploy-check",
  "allow-list-artifacts",
]
